<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RJ Mobile — Ultimate Catalog & Compare Pro</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      /* Dark Theme */
      --bg-base: #09090b; 
      --card-bg: rgba(24, 24, 27, 0.6);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #8b5cf6; 
      --primary-hover: #a78bfa;
      --primary-alpha: rgba(139, 92, 246, 0.2);
      --text-main: #f4f4f5;
      --text-soft: #a1a1aa;
      --success: #10b981; 
      --success-alpha: rgba(16, 185, 129, 0.2);
      --danger: #ef4444;
      --danger-alpha: rgba(239, 68, 68, 0.2);
      --input-bg: rgba(9, 9, 11, 0.6);
      --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.3);
      --glass-blur: blur(16px);
      
      /* Mesh Gradients */
      --mesh-color-1: radial-gradient(at 10% 20%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
      --mesh-color-2: radial-gradient(at 90% 80%, rgba(59, 130, 246, 0.15) 0px, transparent 50%);
    }
    
    body.light-theme {
      --bg-base: #f8fafc; 
      --card-bg: rgba(255, 255, 255, 0.7);
      --card-border: rgba(0, 0, 0, 0.08);
      --primary: #4f46e5; 
      --primary-hover: #6366f1;
      --primary-alpha: rgba(79, 70, 229, 0.15);
      --text-main: #0f172a;
      --text-soft: #64748b;
      --input-bg: rgba(241, 245, 249, 0.6);
      --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.05);
      
      --mesh-color-1: radial-gradient(at 10% 20%, rgba(79, 70, 229, 0.1) 0px, transparent 50%);
      --mesh-color-2: radial-gradient(at 90% 80%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
    }

    body { 
      font-family: 'Inter', system-ui, sans-serif; 
      background-color: var(--bg-base); 
      background-image: var(--mesh-color-1), var(--mesh-color-2);
      background-attachment: fixed;
      color: var(--text-main); 
      min-height: 100vh; padding: 24px 16px; 
      transition: background-color 0.5s ease;
      overflow-x: hidden;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

    h1, h2, h3, .name { font-family: 'Plus Jakarta Sans', sans-serif; }
    #app-container { max-width: 1200px; margin: 0 auto; padding-bottom: 100px; }
    
    /* Glassmorphism Utilities */
    .glass {
      background: var(--card-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-soft);
    }

    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding: 20px 24px; border-radius: 20px; z-index: 100; position: relative;}
    .brand-text .name { font-size: 24px; font-weight: 800; display: flex; align-items: center; }
    .role-badge { background: var(--primary-alpha); color: var(--primary); font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 20px; margin-left: 12px; }
    
    .header-actions { display: flex; gap: 12px; align-items: center; }
    .action-btn { background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-main); cursor: pointer; padding: 12px; border-radius: 14px; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: inline-flex; position: relative;}
    .action-btn:hover { color: var(--primary); border-color: var(--primary); transform: scale(1.05); }
    
    /* Sticky Search & Views */
    .sticky-bar { position: sticky; top: 10px; z-index: 50; display: flex; gap: 12px; margin-bottom: 24px; }
    .search-wrapper { flex: 1; position: relative; }
    .search-wrapper input { width: 100%; padding: 16px 24px 16px 50px; border-radius: 16px; border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text-main); font-size: 16px; outline: none; transition: 0.3s; backdrop-filter: var(--glass-blur); box-shadow: var(--shadow-soft); }
    .search-wrapper input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-alpha), var(--shadow-soft); }
    .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-soft); }
    
    .view-toggles { display: flex; gap: 4px; padding: 6px; border-radius: 16px; align-items: center; }
    .view-toggles .action-btn { padding: 10px; border: none; background: transparent; }

    /* Smart Match Wizard */
    .wizard-container { padding: 24px; border-radius: 20px; margin-bottom: 24px; text-align: center; overflow: hidden; transition: 0.3s ease; }
    .wizard-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: var(--text-main); }
    .wizard-subtitle { color: var(--text-soft); font-size: 14px; margin-bottom: 20px; }
    .wizard-step { display: none; animation: slideUp 0.4s ease forwards; }
    .wizard-step.active { display: block; }
    .wizard-options { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .wizard-btn { background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 12px 24px; border-radius: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .wizard-btn:hover { border-color: var(--primary); background: var(--primary-alpha); transform: translateY(-2px); }

    /* Filters (Slider & Categories) */
    .controls-wrapper { border-radius: 20px; padding: 20px 24px; margin-bottom: 24px; display: flex; flex-direction: column; gap: 20px; }
    .cat-filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .quick-btn { background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-soft); font-size: 13px; font-weight: 600; padding: 10px 16px; border-radius: 12px; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 6px; }
    .quick-btn:hover { color: var(--text-main); border-color: var(--text-soft); }
    .quick-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 15px var(--primary-alpha); }
    
    .price-slider-container { display: flex; align-items: center; gap: 16px; width: 100%; border-top: 1px solid var(--card-border); padding-top: 20px; }
    .price-slider-container label { font-size: 14px; font-weight: 600; color: var(--text-soft); white-space: nowrap; }
    .price-slider { flex: 1; accent-color: var(--primary); cursor: pointer; }
    .price-display { background: var(--input-bg); padding: 8px 16px; border-radius: 10px; font-weight: 700; font-size: 14px; border: 1px solid var(--card-border); }

    /* Grid & Cards */
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; perspective: 1000px; }
    .metric-card { border-radius: 20px; padding: 24px; position: relative; display: flex; flex-direction: column; cursor: pointer; transition: transform 0.1s ease-out, box-shadow 0.3s ease, border-color 0.3s ease; transform-style: preserve-3d; opacity: 0; animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .metric-card:hover { border-color: var(--primary); box-shadow: 0 15px 35px rgba(0,0,0,0.4); z-index: 2; }
    body.light-theme .metric-card:hover { box-shadow: 0 15px 35px rgba(79, 70, 229, 0.15); }
    
    .favorite-btn { position: absolute; top: 20px; right: 20px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: var(--text-soft); cursor: pointer; transition: 0.3s; z-index: 10; backdrop-filter: blur(4px); }
    .favorite-btn:hover { transform: scale(1.1); color: #ec4899; }
    .favorite-btn.active { color: #ec4899; border-color: #ec4899; background: rgba(236, 72, 153, 0.1); }
    .favorite-btn.active svg { fill: #ec4899; }

    .card-header { margin-bottom: 20px; padding-right: 40px; pointer-events: none;}
    .phone-name { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .phone-price { font-size: 18px; font-weight: 700; color: var(--success); }
    .match-badge { display: none; background: linear-gradient(90deg, #f59e0b, #fbbf24); color: #000; font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 8px; text-transform: uppercase; margin-bottom: 8px; width: fit-content; letter-spacing: 0.5px;}

    .antutu-container { margin-bottom: 20px; pointer-events: none; }
    .antutu-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text-soft); }
    .antutu-header span:last-child { color: var(--text-main); font-weight: 800; font-family: 'Plus Jakarta Sans', sans-serif;}
    .antutu-track { width: 100%; height: 8px; background: var(--input-bg); border-radius: 10px; overflow: hidden; border: 1px solid var(--card-border); }
    .antutu-fill { height: 100%; border-radius: 10px; transition: width 1.5s cubic-bezier(0.16, 1, 0.3, 1); width: 0%; }

    .card-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; pointer-events: none; }
    .card-pill { background: var(--input-bg); border: 1px solid var(--card-border); font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 10px; display: flex; align-items: center; gap: 6px; }
    .card-pill svg { color: var(--primary); }

    /* Custom Checkbox */
    .compare-label { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px; background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 14px; cursor: pointer; font-size: 14px; font-weight: 700; transition: 0.3s; margin-top: auto; z-index: 10; position: relative; }
    .compare-label:hover { border-color: var(--primary); background: var(--primary-alpha); }
    .compare-label input { display: none; }
    .custom-checkbox { width: 22px; height: 22px; border: 2px solid var(--text-soft); border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .custom-checkbox svg { width: 14px; height: 14px; color: white; opacity: 0; transform: scale(0.5); transition: 0.2s; }
    .compare-label input:checked + .custom-checkbox { background: var(--primary); border-color: var(--primary); }
    .compare-label input:checked + .custom-checkbox svg { opacity: 1; transform: scale(1); }

    /* Compare Bar & Floating Avatars */
    #compare-bar { position: fixed; bottom: -120px; left: 50%; transform: translateX(-50%); background: var(--card-bg); backdrop-filter: blur(24px); border: 1px solid var(--card-border); padding: 16px 24px; border-radius: 20px; display: flex; align-items: center; gap: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); transition: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 100; width: max-content; max-width: 90vw; }
    #compare-bar.show { bottom: 40px; }
    .selected-avatars { display: flex; gap: 8px; }
    .avatar-bubble { width: 40px; height: 40px; border-radius: 50%; background: var(--input-bg); border: 2px solid var(--primary); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; text-align: center; line-height: 1.1; animation: slideUp 0.3s ease; }
    .btn-compare-action { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 15px; }
    .btn-compare-action:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 8px 20px var(--primary-alpha); }

    /* Modals */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 1000; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: opacity 0.3s ease; }
    .modal-overlay.show { opacity: 1; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 24px; width: 100%; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.5); transform: scale(0.95); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    .modal-overlay.show .modal-content { transform: scale(1); }
    
    .compare-modal-size { max-width: 1200px; }
    .details-modal-size { max-width: 800px; }
    
    .close-modal { position: absolute; top: 20px; right: 20px; background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-main); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; z-index: 50;}
    .close-modal:hover { background: var(--danger); color: white; border-color: var(--danger); transform: rotate(90deg); }

    /* Epic Clash Overlay (Updated for Mobile) */
    #clash-screen { 
      position: absolute; inset: 0; background: var(--bg-base); z-index: 40; 
      display: flex; align-items: center; justify-content: center; 
      font-size: 36px; font-weight: 900; font-family: 'Plus Jakarta Sans', sans-serif; gap: 24px; 
      text-align: center; padding: 20px;
    }
    .clash-name { opacity: 0; transform: translateY(-30px); animation: clashIn 0.5s forwards; line-height: 1.2; max-width: 90vw; word-wrap: break-word;}
    .clash-name:last-child { transform: translateY(30px); }
    .clash-vs { color: var(--primary); font-size: 48px; font-style: italic; opacity: 0; animation: popIn 0.4s 0.3s forwards; }
    
    @keyframes clashIn { to { opacity: 1; transform: translateY(0); } }
    @keyframes popIn { 0% { opacity: 0; transform: scale(0); } 80% { transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }

    /* Compare Table (Updated for Scrolling) */
    .table-container { overflow-y: auto; overflow-x: auto; padding: 30px; opacity: 0; transition: opacity 0.5s 1.2s; width: 100%; -webkit-overflow-scrolling: touch; }
    .compare-table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 600px; }
    .compare-table th, .compare-table td { padding: 18px; border-bottom: 1px solid var(--card-border); border-right: 1px solid var(--card-border); text-align: center; }
    .compare-table th:first-child, .compare-table td:first-child { border-left: 1px solid var(--card-border); position: sticky; left: 0; background: var(--card-bg); z-index: 20; backdrop-filter: blur(10px); }
    .compare-table tr:first-child th { border-top: 1px solid var(--card-border); border-radius: 12px 12px 0 0; }
    .compare-table th { background: rgba(0,0,0,0.2); font-weight: 800; color: var(--text-main); font-size: 18px; position: sticky; top: 0; z-index: 10; backdrop-filter: blur(10px); }
    .compare-table td { color: var(--text-soft); font-size: 15px; font-weight: 500; transition: background 0.2s; background: var(--card-bg);}
    .compare-table tr:hover td { background: var(--input-bg); color: var(--text-main); }
    
    .spec-row-title { font-weight: 800 !important; color: var(--primary) !important; text-align: left !important; background: var(--input-bg) !important; font-size: 16px; letter-spacing: 1px; text-transform: uppercase; }
    
    /* Glowing Winner Cells */
    .winner-cell { background: var(--success-alpha) !important; color: var(--success) !important; font-weight: 800 !important; position: relative; overflow: hidden; }
    .winner-cell::before { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(16, 185, 129, 0.4), transparent); animation: shine 3s infinite; }
    @keyframes shine { to { left: 200%; } }
    .loser-cell { color: var(--danger) !important; }

    /* Bento Grid for Details Modal */
    .bento-modal-body { padding: 30px; overflow-y: auto; }
    .bento-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; grid-auto-rows: minmax(100px, auto); }
    .bento-box { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 24px; display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden; }
    
    .bento-header { grid-column: span 4; text-align: center; background: linear-gradient(135deg, var(--card-bg), var(--primary-alpha)); }
    .bento-header h2 { font-size: 32px; font-weight: 900; margin-bottom: 8px; }
    .bento-header p { font-size: 24px; color: var(--success); font-weight: 800; }
    
    .bento-score { grid-column: span 2; align-items: center; text-align: center; }
    .bento-score-title { font-size: 14px; color: var(--text-soft); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .bento-score-num { font-size: 36px; font-weight: 900; font-family: 'Plus Jakarta Sans'; background: linear-gradient(90deg, var(--primary), #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .bento-rings { grid-column: span 4; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; background: transparent; border: none; padding: 0; }
    .ring-box { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;}
    
    /* Circular Progress */
    .circular-chart { display: block; margin: 0 auto; max-width: 80%; max-height: 250px; }
    .circle-bg { fill: none; stroke: var(--card-border); stroke-width: 3.8; }
    .circle { fill: none; stroke-width: 2.8; stroke-linecap: round; transition: stroke-dasharray 1.5s cubic-bezier(0.16, 1, 0.3, 1); }
    .ring-text { font-size: 12px; font-weight: 700; color: var(--text-soft); text-transform: uppercase; margin-top: 8px;}
    .ring-icon { font-size: 20px; margin-bottom: -5px;}

    .bento-specs { grid-column: span 4; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .spec-line { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--card-border); font-size: 14px; }
    .spec-line span:first-child { color: var(--text-soft); font-weight: 600; }
    .spec-line span:last-child { color: var(--text-main); font-weight: 700; text-align: right; width: 60%; }

    /* Updated Media Query for Mobile */
    @media (max-width: 768px) {
      .bento-grid { grid-template-columns: 1fr; }
      .bento-header, .bento-score, .bento-rings, .bento-specs { grid-column: span 1; }
      .bento-rings { grid-template-columns: 1fr 1fr; gap: 12px;}
      .bento-specs { grid-template-columns: 1fr; }
      .header { flex-direction: column; align-items: flex-start; gap: 16px; }
      
      #compare-bar { width: calc(100% - 32px); flex-direction: column; gap: 12px; border-radius: 16px; bottom: -150px; }
      .selected-avatars { flex-wrap: wrap; justify-content: center; }
      
      /* Fixed Mobile Clash Screen */
      #clash-screen { flex-direction: column; gap: 12px; font-size: 26px; }
      .clash-vs { font-size: 32px; }
      
      /* Mobile Table Adjustments */
      .table-container { padding: 16px; }
      .compare-table th, .compare-table td { padding: 12px; font-size: 13px; }
      .compare-table th { font-size: 14px; }
      .spec-row-title { font-size: 14px !important; }
    }
  </style>
</head>
<body>

  <div id="app-container">
    
    <!-- Header -->
    <div class="header glass">
      <div class="brand-text">
        <div class="name">RJ Mobile <span class="role-badge">PRO</span></div>
        <div style="font-size: 13px; font-weight: 600; color: var(--text-soft); margin-top: 4px;">Expanded Inventory & Smart Compare</div>
      </div>
      <div class="header-actions">
        <button id="btn-favorites" class="action-btn" title="View Favorites" onclick="toggleFavoritesView()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
        </button>
        <button id="btn-wizard" class="action-btn" title="Smart Match" onclick="toggleWizard()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
        </button>
        <button id="theme-toggle" class="action-btn" title="Toggle Theme">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </div>
    </div>

    <!-- Smart Match Wizard -->
    <div id="wizard-section" class="wizard-container glass" style="display: none;">
      <div id="step-1" class="wizard-step active">
        <div class="wizard-title">What is your budget?</div>
        <div class="wizard-subtitle">Let's find the perfect phone for your wallet.</div>
        <div class="wizard-options">
          <button class="wizard-btn" onclick="nextWizard(1, 'budget', '<50000')">Under ₹50k</button>
          <button class="wizard-btn" onclick="nextWizard(1, 'budget', '50000-100000')">₹50k - ₹1 Lakh</button>
          <button class="wizard-btn" onclick="nextWizard(1, 'budget', '>100000')">Premium (>₹1 Lakh)</button>
        </div>
      </div>
      <div id="step-2" class="wizard-step">
        <div class="wizard-title">What matters most?</div>
        <div class="wizard-subtitle">Choose your top priority.</div>
        <div class="wizard-options">
          <button class="wizard-btn" onclick="nextWizard(2, 'priority', 'Camera')">📸 Camera</button>
          <button class="wizard-btn" onclick="nextWizard(2, 'priority', 'Gaming')">🎮 Gaming & Speed</button>
          <button class="wizard-btn" onclick="nextWizard(2, 'priority', 'Battery')">🔋 Battery Life</button>
        </div>
      </div>
      <div id="step-3" class="wizard-step">
        <div class="wizard-title">Preferred Brand Ecosystem?</div>
        <div class="wizard-subtitle">Final step to tailor your results.</div>
        <div class="wizard-options">
          <button class="wizard-btn" onclick="nextWizard(3, 'os', 'Apple')">Apple (iOS)</button>
          <button class="wizard-btn" onclick="nextWizard(3, 'os', 'Android')">Android</button>
          <button class="wizard-btn" onclick="nextWizard(3, 'os', 'Any')">No Preference</button>
        </div>
      </div>
    </div>

    <!-- Sticky Search -->

  </div>

  <script>
    const checkIcon = `<span style="color:var(--success); font-weight:bold;">✔ Yes</span>`;
    const crossIcon = `<span style="color:var(--danger); font-weight:bold;">✘ No</span>`;
    
    function parsePrice(str) { return parseInt(str.replace(/[^0-9]/g, ''), 10); }

    // ==========================================
    // DATABASE (With scores out of 100 for Rings)
    // ==========================================
    const mobiles = [
      { slug: "iphone-15", name: "iPhone 15", brand: "Apple", categories: ["Premium"], antutu: 1350000, 
        scores: { bat: 75, cam: 85, game: 80, disp: 82 },
        processor: "A16 Bionic (4nm)", os: "iOS 17", display: "6.1' Super Retina XDR OLED", resolution: "1179x2556", peakBrightness: "2000 nits", cameraMain: "48MP OIS", cameraUltrawide: "12MP", cameraTelephoto: crossIcon, cameraSelfie: "12MP AF", battery: "3349mAh", wiredCharging: "20W", wirelessCharging: "15W MagSafe", buildFront: "Ceramic Shield", buildBack: "Glass", buildFrame: "Aluminum", weight: "171g", ipRating: "IP68", fingerprint: crossIcon, faceUnlock: checkIcon, nfc: checkIcon, audioJack: crossIcon, sdCard: crossIcon, usbType: "Type-C 2.0",
        variants: [{ ramRom: "6GB / 128GB", price: "₹79,900", numPrice: 79900 }]
      },
      { slug: "iphone-16", name: "iPhone 16", brand: "Apple", categories: ["Premium"], antutu: 1450000, 
        scores: { bat: 78, cam: 88, game: 85, disp: 85 },
        processor: "A18 Bionic (3nm)", os: "iOS 18", display: "6.1' Super Retina XDR OLED", resolution: "1179x2556", peakBrightness: "2000 nits", cameraMain: "48MP OIS", cameraUltrawide: "12MP AF", cameraTelephoto: crossIcon, cameraSelfie: "12MP AF", battery: "3561mAh", wiredCharging: "25W", wirelessCharging: "15W", buildFront: "Ceramic Shield", buildBack: "Glass", buildFrame: "Aluminum", weight: "170g", ipRating: "IP68", fingerprint: crossIcon, faceUnlock: checkIcon, nfc: checkIcon, audioJack: crossIcon, sdCard: crossIcon, usbType: "Type-C 2.0",
        variants: [{ ramRom: "8GB / 128GB", price: "₹79,900", numPrice: 79900 }]
      },
      { slug: "iphone-17-pro-max", name: "iPhone 17 Pro Max", brand: "Apple", categories: ["Premium", "Camera"], antutu: 1850000, 
        scores: { bat: 92, cam: 98, game: 95, disp: 97 },
        processor: "A19 Pro (2nm)", os: "iOS 19", display: "6.9' LTPO OLED (120Hz)", resolution: "1320x2868", peakBrightness: "3000 nits", cameraMain: "48MP OIS (1-inch)", cameraUltrawide: "48MP AF", cameraTelephoto: "48MP (5x Optical)", cameraSelfie: "24MP AF", battery: "5000mAh", wiredCharging: "45W", wirelessCharging: "25W MagSafe", buildFront: "Ceramic Shield Gen 3", buildBack: "Glass", buildFrame: "Titanium", weight: "230g", ipRating: "IP68", fingerprint: crossIcon, faceUnlock: checkIcon, nfc: checkIcon, audioJack: crossIcon, sdCard: crossIcon, usbType: "Type-C 4.0",
        variants: [{ ramRom: "12GB / 256GB", price: "₹1,59,900", numPrice: 159900 }]
      },
      { slug: "galaxy-s24-ultra", name: "Galaxy S24 Ultra", brand: "Samsung", categories: ["Premium", "Camera", "Gaming"], antutu: 1950000, 
        scores: { bat: 90, cam: 96, game: 94, disp: 98 },
        processor: "Snapdragon 8 Gen 3", os: "Android 14", display: "6.8' LTPO AMOLED", resolution: "1440x3120", peakBrightness: "2600 nits", cameraMain: "200MP OIS", cameraUltrawide: "12MP", cameraTelephoto: "50MP (5x) + 10MP (3x)", cameraSelfie: "12MP AF", battery: "5000mAh", wiredCharging: "45W", wirelessCharging: "15W Qi", buildFront: "Gorilla Armor", buildBack: "Gorilla Glass", buildFrame: "Titanium", weight: "232g", ipRating: "IP68", fingerprint: checkIcon, faceUnlock: checkIcon, nfc: checkIcon, audioJack: crossIcon, sdCard: crossIcon, usbType: "Type-C 3.2",
        variants: [{ ramRom: "12GB / 256GB", price: "₹1,29,999", numPrice: 129999 }]
      },
      { slug: "vivo-x300-pro", name: "Vivo X300 Pro", brand: "Vivo", categories: ["Camera", "Premium"], antutu: 2600000, 
        scores: { bat: 98, cam: 99, game: 92, disp: 94 },
        processor: "Dimensity 9400", os: "Android 15", display: "6.82' LTPO AMOLED", resolution: "1440x3200", peakBrightness: "4500 nits", cameraMain: "50MP OIS (1-inch)", cameraUltrawide: "50MP", cameraTelephoto: "200MP (5x APO)", cameraSelfie: "50MP AF", battery: "6000mAh", wiredCharging: "120W", wirelessCharging: "50W", buildFront: "Armor Glass", buildBack: "Vegan Leather", buildFrame: "Titanium", weight: "225g", ipRating: "IP68", fingerprint: checkIcon, faceUnlock: checkIcon, nfc: checkIcon, audioJack: crossIcon, sdCard: crossIcon, usbType: "Type-C 4.0",
        variants: [{ ramRom: "16GB / 512GB", price: "₹94,999", numPrice: 94999 }]
      },
      { slug: "xiaomi-15-pro", name: "Xiaomi 15 Pro", brand: "Xiaomi", categories: ["Premium", "Gaming"], antutu: 2450000, 
        scores: { bat: 94, cam: 90, game: 98, disp: 95 },
        processor: "Snapdragon 8 Gen 4", os: "HyperOS", display: "6.73' 2K LTPO", resolution: "1440x3200", peakBrightness: "3500 nits", cameraMain: "50MP Leica OIS", cameraUltrawide: "50MP", cameraTelephoto: "50MP (5x)", cameraSelfie: "32MP", battery: "5400mAh", wiredCharging: "90W", wirelessCharging: "50W", buildFront: "Dragon Crystal", buildBack: "Glass", buildFrame: "Aluminum", weight: "210g", ipRating: "IP68", fingerprint: checkIcon, faceUnlock: checkIcon, nfc: checkIcon, audioJack: crossIcon, sdCard: crossIcon, usbType: "Type-C 3.2",
        variants: [{ ramRom: "12GB / 256GB", price: "₹79,999", numPrice: 79999 }]
      }
    ];

    let selectedForCompare = [];
    let activeCategories = [];
    let favorites = JSON.parse(localStorage.getItem('rj_favorites')) || [];
    let showOnlyFavorites = false;
    let wizardMatches = [];

    const searchInput = document.getElementById('search-input');
    const priceSlider = document.getElementById('price-slider');
    const priceDisplay = document.getElementById('price-display');
    const gridContainer = document.getElementById('product-grid');

    // Theme Logic
    const themeToggleBtn = document.getElementById('theme-toggle');
    function applyTheme() {
      const isLight = localStorage.getItem('rj_theme') === 'light';
      document.body.classList.toggle('light-theme', isLight);
      themeToggleBtn.innerHTML = isLight ? 
        '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line></svg>' : 
        '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
    }
    themeToggleBtn.addEventListener('click', () => { localStorage.setItem('rj_theme', document.body.classList.contains('light-theme') ? 'dark' : 'light'); applyTheme(); });
    applyTheme();

    // Favorites Logic
    function toggleFavorite(e, slug) {
      e.stopPropagation();
      const idx = favorites.indexOf(slug);
      if(idx > -1) favorites.splice(idx, 1); else favorites.push(slug);
      localStorage.setItem('rj_favorites', JSON.stringify(favorites));
      e.currentTarget.classList.toggle('active');
      if(showOnlyFavorites) renderGrid();
    }
    function toggleFavoritesView() {
      showOnlyFavorites = !showOnlyFavorites;
      document.getElementById('btn-favorites').style.color = showOnlyFavorites ? '#ec4899' : '';
      renderGrid();
    }

    // Smart Match Wizard
    let wizardState = {};
    function toggleWizard() {
      const w = document.getElementById('wizard-section');
      w.style.display = w.style.display === 'none' ? 'block' : 'none';
      if(w.style.display === 'none') { wizardMatches = []; renderGrid(); }
      document.querySelectorAll('.wizard-step').forEach((s,i) => s.classList.toggle('active', i===0));
      wizardState = {};
    }
    function nextWizard(step, key, val) {
      wizardState[key] = val;
      document.getElementById(`step-${step}`).classList.remove('active');
      if(step < 3) {
        document.getElementById(`step-${step+1}`).classList.add('active');
      } else {
        processWizardResults();
        setTimeout(() => document.getElementById('wizard-section').style.display = 'none', 1000);
      }
    }
    function processWizardResults() {
      let filtered = [...mobiles];
      // 1. Budget
      if(wizardState.budget === '<50000') filtered = filtered.filter(m => m.variants[0].numPrice < 50000);
      if(wizardState.budget === '50000-100000') filtered = filtered.filter(m => m.variants[0].numPrice >= 50000 && m.variants[0].numPrice <= 100000);
      // 2. OS
      if(wizardState.os === 'Apple') filtered = filtered.filter(m => m.brand === 'Apple');
      if(wizardState.os === 'Android') filtered = filtered.filter(m => m.brand !== 'Apple');
      // 3. Priority Sort
      if(wizardState.priority === 'Camera') filtered.sort((a,b) => b.scores.cam - a.scores.cam);
      if(wizardState.priority === 'Gaming') filtered.sort((a,b) => b.scores.game - a.scores.game);
      if(wizardState.priority === 'Battery') filtered.sort((a,b) => b.scores.bat - a.scores.bat);
      
      wizardMatches = filtered.slice(0, 3).map(m => m.slug);
      renderGrid();
    }

    // Grid Render
    function renderGrid() {
      gridContainer.innerHTML = '';
      const query = searchInput.value.toLowerCase();
      const maxP = parseInt(priceSlider.value);

      let filtered = mobiles.filter(m => {
        if (showOnlyFavorites && !favorites.includes(m.slug)) return false;
        if (wizardMatches.length > 0 && !wizardMatches.includes(m.slug)) return false;
        
        const matchPrice = m.variants[0].numPrice <= maxP;
        const matchCat = activeCategories.length === 0 || m.categories.some(c => activeCategories.includes(c)) || activeCategories.includes(m.brand);
        const matchSearch = m.name.toLowerCase().includes(query) || m.brand.toLowerCase().includes(query) || m.processor.toLowerCase().includes(query);
        
        return matchCat && matchSearch && matchPrice;
      });

      if(filtered.length === 0) {
        gridContainer.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding: 60px; color:var(--text-soft);"><h3>No phones match your criteria.</h3></div>`; return;
      }

      filtered.forEach((phone, index) => {
        const isFav = favorites.includes(phone.slug) ? 'active' : '';
        const isChecked = selectedForCompare.includes(phone.slug) ? 'checked' : '';
        const isMatch = wizardMatches.includes(phone.slug) ? '<div class="match-badge">⭐ Top Match</div>' : '';
        const antutuPercent = (phone.antutu / 3000000) * 100;
        const antutuColor = phone.antutu > 2000000 ? 'linear-gradient(90deg, #8b5cf6, #3b82f6)' : 'linear-gradient(90deg, #10b981, #34d399)';

        const card = document.createElement('div');
        card.className = 'metric-card glass';
        card.style.animationDelay = `${index * 0.08}s`;
        
        // 3D Tilt Effect
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left; const y = e.clientY - rect.top;
          const rotateX = ((y / rect.height) - 0.5) * -15; const rotateY = ((x / rect.width) - 0.5) * 15;
          card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
        });
        card.addEventListener('mouseleave', () => card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)');

        card.onclick = (e) => { if(!e.target.closest('label') && !e.target.closest('.favorite-btn')) showDetailsModal(phone.slug); };

        card.innerHTML = `
          <button class="favorite-btn ${isFav}" onclick="toggleFavorite(event, '${phone.slug}')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
          </button>
          
          <div class="card-header">
            ${isMatch}
            <div class="phone-name">${phone.name}</div>
            <div class="phone-price">${phone.variants[0].price}</div>
          </div>
          
          <div class="card-pills">
            <div class="card-pill"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/></svg> ${phone.variants[0].ramRom.split('/')[0]}</div>
            <div class="card-pill"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> ${phone.cameraMain.split(' ')[0]}</div>
          </div>

          <div class="antutu-container">
            <div class="antutu-header"><span>AnTuTu Benchmark</span> <span class="counter" data-target="${phone.antutu}">0</span></div>
            <div class="antutu-track"><div class="antutu-fill" style="width: ${antutuPercent}%; background: ${antutuColor};"></div></div>
          </div>

          <label class="compare-label" onclick="event.stopPropagation()">
            <input type="checkbox" value="${phone.slug}" onchange="toggleCompare('${phone.slug}', this)" ${isChecked}>
            <div class="custom-checkbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
            Add to Compare
          </label>
        `;
        gridContainer.appendChild(card);
      });
      runCounters();
    }

    // Number Counting Animation
    function runCounters() {
      document.querySelectorAll('.counter').forEach(el => {
        const target = +el.getAttribute('data-target');
        let count = 0; const increment = target / 50;
        const update = () => { count += increment; if(count < target) { el.innerText = Math.ceil(count).toLocaleString(); requestAnimationFrame(update); } else { el.innerText = target.toLocaleString(); } };
        update();
      });
    }

    // Filters logic
    document.querySelectorAll('.quick-btn[data-cat]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const cat = e.target.getAttribute('data-cat');
        if (activeCategories.includes(cat)) { activeCategories = activeCategories.filter(c => c !== cat); e.target.classList.remove('active'); }
        else { activeCategories.push(cat); e.target.classList.add('active'); }
        renderGrid();
      });
    });
    document.getElementById('btn-clear-cats').addEventListener('click', () => { activeCategories = []; document.querySelectorAll('.quick-btn[data-cat]').forEach(b => b.classList.remove('active')); renderGrid(); });
    
    searchInput.addEventListener('input', renderGrid);
    priceSlider.addEventListener('input', (e) => { priceDisplay.innerText = `Up to ₹${parseInt(e.target.value).toLocaleString()}`; renderGrid(); });

    // Compare Logic
    function toggleCompare(slug, checkbox) {
      if (checkbox.checked) {
        if (selectedForCompare.length >= 3) { alert("Maximum 3 phones allowed."); checkbox.checked = false; return; }
        selectedForCompare.push(slug);
      } else { selectedForCompare = selectedForCompare.filter(s => s !== slug); }
      updateCompareBar();
    }

    function clearCompare() { selectedForCompare = []; document.querySelectorAll('.compare-label input').forEach(cb => cb.checked = false); updateCompareBar(); }

    function updateCompareBar() {
      const bar = document.getElementById('compare-bar');
      const container = document.getElementById('selected-avatars-container');
      container.innerHTML = '';
      selectedForCompare.forEach(slug => {
        const p = mobiles.find(m => m.slug === slug);
        container.innerHTML += `<div class="avatar-bubble">${p.name.substring(0,3).toUpperCase()}</div>`;
      });
      bar.classList.toggle('show', selectedForCompare.length >= 2);
    }

    // Modals
    function closeModal(id) { document.getElementById(id).classList.remove('show'); setTimeout(() => document.getElementById(id).style.display='none', 300); }

    function showCompareModal() {
      if(selectedForCompare.length < 2) return;
      const modal = document.getElementById('compare-modal');
      const clash = document.getElementById('clash-screen');
      const container = document.getElementById('compare-table-container');
      
      const phones = mobiles.filter(m => selectedForCompare.includes(m.slug));
      modal.style.display = 'flex';
      setTimeout(() => modal.classList.add('show'), 10);
      
      // Epic Clash Sequence
      clash.style.display = 'flex'; container.style.opacity = '0';
      clash.innerHTML = `<div class="clash-name">${phones[0].name}</div><div class="clash-vs">VS</div><div class="clash-name">${phones[1].name}</div>`;
      if(phones[2]) clash.innerHTML += `<div class="clash-vs">VS</div><div class="clash-name">${phones[2].name}</div>`;
      
      setTimeout(() => { clash.style.display = 'none'; container.style.opacity = '1'; }, 1800);

      const maxAntutu = Math.max(...phones.map(p => p.antutu));
      let html = `<table class="compare-table">`;
      html += `<tr><th style="text-align:left;">Specs</th>${phones.map(p => `<th>${p.name}<br><span style="font-size:14px; color:var(--success); font-weight:600;">${p.variants[0].price}</span></th>`).join('')}</tr>`;
      html += `<tr><td class="spec-row-title" colspan="${phones.length + 1}">Performance</td></tr>`;
      html += `<tr><td style="text-align:left; font-weight:700;">Processor</td>${phones.map(p => `<td>${p.processor}</td>`).join('')}</tr>`;
      html += `<tr><td style="text-align:left; font-weight:700;">AnTuTu Score</td>${phones.map(p => `<td class="${p.antutu===maxAntutu?'winner-cell':''}">${p.antutu.toLocaleString()}</td>`).join('')}</tr>`;
      html += `<tr><td class="spec-row-title" colspan="${phones.length + 1}">Display & Camera</td></tr>`;
      html += `<tr><td style="text-align:left; font-weight:700;">Screen</td>${phones.map(p => `<td>${p.display} (${p.peakBrightness})</td>`).join('')}</tr>`;
      html += `<tr><td style="text-align:left; font-weight:700;">Main Cam</td>${phones.map(p => `<td>${p.cameraMain}</td>`).join('')}</tr>`;
      html += `<tr><td class="spec-row-title" colspan="${phones.length + 1}">Battery</td></tr>`;
      html += `<tr><td style="text-align:left; font-weight:700;">Capacity</td>${phones.map(p => `<td>${p.battery} (${p.wiredCharging})</td>`).join('')}</tr>`;
      html += `</table>`;
      container.innerHTML = html;
    }

    // Bento Details Modal
    function showDetailsModal(slug) {
      const phone = mobiles.find(m => m.slug === slug);
      if(!phone) return;
      const modal = document.getElementById('details-modal');
      const body = document.getElementById('details-body');
      
      const createRing = (score, label, icon) => {
        const dash = `${score}, 100`;
        const color = score > 85 ? 'var(--success)' : (score > 70 ? '#f59e0b' : 'var(--danger)');
        return `
          <div class="ring-box">
            <div class="ring-icon">${icon}</div>
            <svg viewBox="0 0 36 36" class="circular-chart">
              <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
              <path class="circle" stroke="${color}" stroke-dasharray="0, 100" data-dash="${dash}" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
              <text x="18" y="22.5" font-size="10" font-weight="800" fill="var(--text-main)" text-anchor="middle">${score}</text>
            </svg>
            <div class="ring-text">${label}</div>
          </div>`;
      };

      body.innerHTML = `
        <div class="bento-grid">
          <div class="bento-box bento-header">
            <h2>${phone.name}</h2>
            <p>${phone.variants[0].price}</p>
            <div style="margin-top:10px; color:var(--text-soft); font-weight:600;">${phone.variants[0].ramRom}</div>
          </div>
          
          <div class="bento-box bento-score">
            <div class="bento-score-title">AnTuTu Benchmark</div>
            <div class="bento-score-num counter" data-target="${phone.antutu}">0</div>
          </div>
          <div class="bento-box bento-score">
            <div class="bento-score-title">OS / Chipset</div>
            <div style="font-size:20px; font-weight:800; color:var(--text-main);">${phone.processor}</div>
            <div style="font-size:14px; color:var(--text-soft); margin-top:4px;">${phone.os}</div>
          </div>

          <div class="bento-box bento-rings">
            ${createRing(phone.scores.cam, 'Camera', '📸')}
            ${createRing(phone.scores.bat, 'Battery', '🔋')}
            ${createRing(phone.scores.game, 'Gaming', '🎮')}
            ${createRing(phone.scores.disp, 'Display', '📺')}
          </div>

          <div class="bento-box bento-specs">
            <div>
              <div class="spec-line"><span>Display</span><span>${phone.display}</span></div>
              <div class="spec-line"><span>Brightness</span><span>${phone.peakBrightness}</span></div>
              <div class="spec-line"><span>Main Camera</span><span>${phone.cameraMain}</span></div>
              <div class="spec-line"><span>Telephoto</span><span>${phone.cameraTelephoto}</span></div>
            </div>
            <div>
              <div class="spec-line"><span>Battery</span><span>${phone.battery}</span></div>
              <div class="spec-line"><span>Charging</span><span>${phone.wiredCharging}</span></div>
              <div class="spec-line"><span>IP Rating</span><span>${phone.ipRating}</span></div>
              <div class="spec-line"><span>Build</span><span>${phone.buildFrame}</span></div>
            </div>
          </div>
        </div>
      `;
      
      modal.style.display = 'flex';
      setTimeout(() => {
        modal.classList.add('show');
        runCounters();
        setTimeout(() => {
          document.querySelectorAll('.circle').forEach(c => c.setAttribute('stroke-dasharray', c.getAttribute('data-dash')));
        }, 300);
      }, 10);
    }

    renderGrid();
  </script>
</body>
</html>
